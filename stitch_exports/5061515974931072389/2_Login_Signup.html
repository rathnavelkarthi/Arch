<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<div class="relative flex h-full max-w-[480px] w-full flex-col bg-slate-50 dark:bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-800">
<!-- Mobile Status Bar Emulation -->
<div class="flex justify-between items-center px-6 py-3 w-full text-slate-900 dark:text-slate-100">
<span class="text-xs font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-symbols-outlined text-sm">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-sm">wifi</span>
<span class="material-symbols-outlined text-sm">battery_full</span>
</div>
</div>
<!-- Header with Soft Brazil-Inspired Gradient & Illustration -->
<div class="relative w-full h-64 overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 via-primary/5 to-transparent dark:from-primary/30 dark:via-primary/10"></div>
<div class="absolute inset-0 flex flex-col items-center justify-center p-6 text-center">
<div class="w-24 h-24 bg-primary/10 rounded-full flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-5xl">architecture</span>
</div>
<h1 class="text-3xl font-bold text-slate-900 dark:text-slate-100 tracking-tight">BuildVerse</h1>
<p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Constructing the future of design</p>
</div>
<!-- Decorative Element (Abstract Curves) -->
<div class="absolute -bottom-1 left-0 w-full h-12 bg-slate-50 dark:bg-slate-900 rounded-t-xl"></div>
</div>
<!-- Form Content -->
<div class="px-8 pb-10 flex flex-col gap-6">
<div class="space-y-1">
<h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Sign in</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm">Welcome back! Please enter your details.</p>
</div>
<div class="space-y-4">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-slate-900 dark:text-slate-100" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center px-1">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Password</label>
<a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all text-slate-900 dark:text-slate-100" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                Continue
            </button>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-[1px] flex-1 bg-slate-200 dark:bg-slate-700"></div>
<span class="text-xs text-slate-400 font-medium uppercase tracking-wider">or continue with</span>
<div class="h-[1px] flex-1 bg-slate-200 dark:bg-slate-700"></div>
</div>
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-750 transition-colors shadow-sm">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google colorful logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBkuZPNZmgMJUgqaENhypNDM_IcT-9juNZnqOTrG2ulPCociI207kwWRYJZd73aGG9imIK_eGySoBCJWyK_0O9Vh-G_tK_9PhVbAYZOXWAjOoI23MTrnczcDKB1r3Uj8p4nxdVTkgtjyB0t6HHiNdmIcrZtti56MKwB2E3hZ6-3XBmNmQ5eZGA4k2Z_TKnbK0Xg6nPo3gDQeQ0K6qnYB89AoHdRhpvQTCN_52cUd6OOzMpEINdYa9Zv6dcFKjJwxUIWZCJupgShP64"/>
<span class="text-slate-700 dark:text-slate-200 font-semibold text-sm">Google</span>
</button>
<!-- Footer Link -->
<p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-2">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Create account</a>
</p>
</div>
<!-- Bottom Safe Area Indicator -->
<div class="flex justify-center pb-2 w-full">
<div class="h-1.5 w-32 bg-slate-300 dark:bg-slate-700 rounded-full opacity-50"></div>
</div>
</div>
</body></html>
